[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  # Update to Node.js 20 or 22 (Vite requires 20.19+ or 22.12+)
  NODE_VERSION = "20"  # or "22"

# Optional: Add plugins for better performance
[[plugins]]
  package = "@netlify/plugin-lighthouse"
